name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  plan:
    needs: checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_enable_waf: ${{ vars.ENABLE_WAF || 'false' }}
      TF_VAR_enable_api_cache: ${{ vars.ENABLE_API_CACHE || 'false' }}
      PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require plan role variable
        run: |
          if [ -z "$PLAN_ROLE_ARN" ]; then
            echo "::error::Repository variable AWS_PLAN_ROLE_ARN is not set"
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - name: Terraform init
        run: terraform -chdir=infra init -input=false
      - name: Terraform plan
        run: terraform -chdir=infra plan -lock=false -no-color -input=false -out=tfplan
      - name: Render plan
        run: terraform -chdir=infra show -no-color tfplan > plan.txt
      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const max = 60000;
            let plan = fs.readFileSync('plan.txt', 'utf8');
            const lines = plan.split('\n');
            const summary = lines.find(l => l.startsWith('Plan:') || l.startsWith('No changes.')) || 'See plan below.';
            let note = '';
            if (plan.length > max) {
              plan = plan.slice(0, max);
              note = '\n\n_Plan truncated to 60000 characters; see the workflow run logs for the full plan._';
            }
            const body = `${marker}\n### Terraform plan\n\n**${summary}**\n\n<details><summary>Show plan</summary>\n\n\`\`\`text\n${plan}\n\`\`\`\n\n</details>${note}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
