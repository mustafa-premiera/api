name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_enable_waf: ${{ vars.ENABLE_WAF || 'false' }}
      TF_VAR_enable_api_cache: ${{ vars.ENABLE_API_CACHE || 'false' }}
      DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require deploy role variable and alert email secret
        run: |
          if [ -z "$DEPLOY_ROLE_ARN" ]; then
            echo "::error::Repository variable AWS_DEPLOY_ROLE_ARN is not set"
            exit 1
          fi
          if [ -z "$TF_VAR_alert_email" ]; then
            echo "::error::Repository secret ALERT_EMAIL is not set"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Guard - remote state must exist
        run: |
          aws s3api head-object --bucket manara-todo-tfstate-609417966933 --key infra/terraform.tfstate >/dev/null || { echo "::error::Remote state missing — run the bootstrap and state migration first"; exit 1; }
      - name: Terraform init
        run: terraform -chdir=infra init -input=false
      - name: Terraform apply
        run: terraform -chdir=infra apply -auto-approve -input=false
      - name: Deploy frontend
        run: ./scripts/deploy_frontend.sh
      - name: Summary
        run: |
          echo "App: $(terraform -chdir=infra output -raw app_url)" >> "$GITHUB_STEP_SUMMARY"
